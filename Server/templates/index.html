
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Minimal Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        h1 { font-size: 20px; font-weight: 600; color: #38bdf8; }
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #166534; color: #4ade80; }
        
        /* Metric Cards Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px; }
        .card .value { font-size: 28px; font-weight: 700; color: #f8fafc; }

        /* Data Table */
        .table-container { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px 16px; font-weight: 600; }
        td { padding: 12px 16px; border-top: 1px solid #334155; }
        tr:hover { background: #334155; }
        .pump-on { color: #4ade80; font-weight: 600; }
        .pump-off { color: #f87171; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 ESP32 Live Telemetry</h1>
            <span class="status-badge" id="live-status">LIVE UPDATING</span>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Soil Moisture</h3>
                <div class="value" id="val-moisture">-- %</div>
            </div>
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="val-temp">-- °C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="val-humidity">-- %</div>
            </div>
            <div class="card">
                <h3>Water Pump</h3>
                <div class="value" id="val-pump">--</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Moisture</th>
                        <th>Temperature</th>
                        <th>Humidity</th>
                        <th>Pump</th>
                    </tr>
                </thead>
                <tbody id="logs-tbody">
                    <tr><td colspan="5" style="text-align:center;">Loading sensor records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                if (data.length > 0) {
                    const latest = data[data.length - 1];
                    
                    // Update Metric Cards
                    document.getElementById('val-moisture').innerText = latest.moisture + '%';
                    document.getElementById('val-temp').innerText = latest.temp + ' °C';
                    document.getElementById('val-humidity').innerText = latest.humidity + '%';
                    
                    const pumpEl = document.getElementById('val-pump');
                    if (latest.pump) {
                        pumpEl.innerText = 'ON 💧';
                        pumpEl.className = 'value pump-on';
                    } else {
                        pumpEl.innerText = 'OFF ⏸️';
                        pumpEl.className = 'value pump-off';
                    }

                    // Populate Table (Most recent 10 records)
                    const tbody = document.getElementById('logs-tbody');
                    tbody.innerHTML = '';
                    
                    [...data].reverse().slice(0, 10).forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.timestamp}</td>
                            <td>${row.moisture}%</td>
                            <td>${row.temp} °C</td>
                            <td>${row.humidity}%</td>
                            <td class="${row.pump ? 'pump-on' : 'pump-off'}">${row.pump ? 'ACTIVE' : 'IDLE'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Failed to fetch API data:", err);
            }
        }

        // Fetch data immediately, then auto-refresh every 2 seconds
        updateDashboard();
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
